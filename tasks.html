function startFocus(id){
  const t=S.tasks.find(x=>x.id===id&&x.status==='open');
  if(!t){toast('حدد مهمة مفتوحة أولًا (J/K ثم F)');return;}
  closeLayers();
  U.focus={taskId:id,started:Date.now(),timer:null,pomo:S.settings.pomo,phase:'work'};
  const el=document.createElement('div');el.className='focus';el.id='focusLayer';
  const draw=()=>{
    const t2=S.tasks.find(x=>x.id===id);const sec=Math.floor((Date.now()-U.focus.started)/1000);
    let disp,pct=0;
    if(U.focus.pomo){const len=U.focus.phase==='work'?25*60:5*60;const left=Math.max(0,len-sec);disp=`${pad(Math.floor(left/60))}:${pad(left%60)}`;pct=Math.round((1-left/len)*100);if(left===0){if(U.focus.phase==='work'){U.focus.phase='break';U.focus.started=Date.now();U.focus.workedBefore=(U.focus.workedBefore||0)+25;toast('انتهت 25 دقيقة · استراحة 5');}else{U.focus.phase='work';U.focus.started=Date.now();toast('عودة للعمل');}}}
    else disp=`${pad(Math.floor(sec/60))}:${pad(sec%60)}`;
    el.innerHTML=`<button class="esc" data-esc>إنهاء الجلسة <kbd style="background:transparent;color:inherit;border-color:rgba(255,255,255,.3)">Esc</kbd></button>
      <div class="ttl">${esc(t2.title)}</div>
      ${U.focus.pomo?`<div class="pomo" style="--pct:${pct}%"><i></i></div><div class="muted" style="color:rgba(255,255,255,.6);font-size:13px">${U.focus.phase==='work'?'عمل':'استراحة'}</div>`:''}
      <div class="timer">${disp}</div>
      ${t2.checklist.length?`<ul class="steps">${t2.checklist.map((c,i)=>`<li class="${c.done?'dn':''}" data-ci="${i}"><i></i>${esc(c.text)}</li>`).join('')}</ul>`:''}
      <button class="stop" data-stop>إيقاف</button>`;
    $$('[data-ci]',el).forEach(li=>li.onclick=()=>{t2.checklist[+li.dataset.ci].done=!t2.checklist[+li.dataset.ci].done;save();draw();});
    $('[data-stop]',el).onclick=()=>stopFocus();$('[data-esc]',el).onclick=()=>stopFocus();
  };
  document.body.append(el);draw();
  U.focus.timer=setInterval(draw,1000);
  $('#focusBtn').innerHTML='<span>■</span><span class="lbl">إيقاف</span>';
}
function stopFocus(silent=false){
  const f=U.focus;if(!f)return;clearInterval(f.timer);
  const mins=Math.max(1,Math.round((Date.now()-f.started)/60000))+(f.workedBefore||0);
  const t=S.tasks.find(x=>x.id===f.taskId);
  const el=$('#focusLayer');
  const finish=(done)=>{if(t){t.actual_min=(t.actual_min||0)+mins;S.sessions.push({id:uid(),task_id:t.id,started_at:new Date(Date.now()-mins*60000).toISOString(),minutes:mins,kind:f.pomo?'pomo':'focus'});}
    U.focus=null;el?.remove();$('#focusBtn').innerHTML='<span>▶</span><span class="lbl">التركيز</span>';save();
    if(done&&t&&t.status==='open')completeTask(t.id);else render();};
  if(silent||!t){finish(false);return;}
  el.innerHTML=`<div class="sheet"><p>سُجّلت <b>${fmtDur(mins)}</b> في «${esc(t.title)}». تمّت؟</p><div class="btns"><button class="btn accent" data-y>نعم، تمّت</button><button class="btn" data-n>أكمل لاحقًا</button></div></div>`;
  $('[data-y]',el).onclick=()=>finish(true);$('[data-n]',el).onclick=()=>finish(false);$('[data-y]',el).focus();
}

/* ---------- لوحة المفاتيح ---------- */
let chord=null,chordT=null;
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  const meta=e.metaKey||e.ctrlKey;
  if(e.code==='Escape'){
    if(U.focus){if($('#focusLayer .sheet'))return;e.preventDefault();stopFocus();return;}
    if($('#layers').children.length){closeLayers();return;}
    if(U.detail){U.detail=null;render();return;}
    if(U.panelOpen){U.panelOpen=false;renderPanel();return;}
    return;}
  if(meta&&e.code==='KeyK'){e.preventDefault();if($('#cmdk'))closeLayers();else openCmd();return;}
  if(meta&&e.code==='KeyZ'&&!typing){e.preventDefault();doUndo();return;}
  if(typing||$('#layers').children.length||U.focus)return;
  if(e.altKey||meta)return;
  // chord G
  if(chord==='g'){chord=null;clearTimeout(chordT);const map={KeyD:'#/day',KeyT:'#/timeline',KeyI:'#/ideas',KeyP:'#/progress'};if(map[e.code]){e.preventDefault();go(map[e.code]);}return;}
  const rows=$$('#main .task');
  const selRow=()=>rows.find(r=>r.dataset.id===U.sel);
  const select=i=>{i=clamp(i,0,rows.length-1);rows.forEach(r=>r.classList.remove('selected'));if(rows[i]){rows[i].classList.add('selected');U.sel=rows[i].dataset.id;U.selIdx=i;rows[i].scrollIntoView({block:'nearest'});}};
  switch(e.code){
    case 'KeyQ':e.preventDefault();openCapture();break;
    case 'Slash':if(e.shiftKey){e.preventDefault();helpModal();}break;
    case 'KeyG':chord='g';chordT=setTimeout(()=>chord=null,900);break;
    case 'KeyJ':e.preventDefault();select(rows.findIndex(r=>r.dataset.id===U.sel)+1);break;
    case 'KeyK':e.preventDefault();select(Math.max(0,rows.findIndex(r=>r.dataset.id===U.sel)-1));break;
    case 'Space':if(U.sel&&selRow()){e.preventDefault();const t=S.tasks.find(x=>x.id===U.sel);t.status==='open'?completeTask(U.sel):reopen(U.sel);}break;
    case 'KeyX':if(U.route==='#/ideas'){e.preventDefault();triage('archive');}else if(U.sel&&selRow()){e.preventDefault();wontDo(U.sel);}break;
    case 'KeyF':if(U.sel&&selRow()){e.preventDefault();startFocus(U.sel);}else if(U.route==='#/day'&&rows[0]){e.preventDefault();startFocus(rows[0].dataset.id);}break;
    case 'KeyE':if(U.sel&&selRow()){e.preventDefault();inlineEdit(selRow());}break;
    case 'Enter':if(U.sel&&selRow()){e.preventDefault();openDetail(U.sel);}break;
    case 'Digit0':case 'Digit1':case 'Digit2':case 'Digit3':if(U.sel&&selRow()){e.preventDefault();setPriority(U.sel,+e.code.slice(-1));render();}break;
    case 'KeyD':if(U.sel&&selRow()){e.preventDefault();miniModal('متى تعمل عليها؟',[{l:'اليوم',v:today()},{l:'غدًا',v:addDays(today(),1)},{l:'بعد أسبوع',v:addDays(today(),7)}],v=>{moveToDay(U.sel,v);render();toast('نُقلت إلى '+relDate(v),{undo:true});},true);}break;
    case 'KeyT':if(U.route==='#/timeline'){e.preventDefault();U.tlDate=today();render();}break;
    case 'ArrowLeft':if(U.route==='#/timeline'){e.preventDefault();U.tlDate=addDays(U.tlDate,1);render();}break;
    case 'ArrowRight':if(U.route==='#/timeline'){e.preventDefault();U.tlDate=addDays(U.tlDate,-1);render();}break;
    case 'BracketLeft':e.preventDefault();U.side=!U.side;$('#app').classList.toggle('side-collapsed',U.side);break;
    case 'BracketRight':e.preventDefault();$('#app').classList.toggle('panel-collapsed');break;
    case 'KeyA':if(U.route==='#/ideas'){e.preventDefault();triage('task');}break;
    case 'KeyS':if(U.route==='#/ideas'){e.preventDefault();triage('snooze');}break;
    case 'KeyM':if(U.route==='#/ideas'){e.preventDefault();triage('project');}break;
  }
});

/* ---------- بيانات تجريبية ---------- */

  const t=today();
  const p1=ensureProject('متجر'),p2=ensureProject('الموقع'),p3=ensureProject('شخصي');
  const add=(o)=>{const x=newTask(o);if(x.work_date)x.order=nextOrder(x.work_date);S.tasks.push(x);return x;};
  add({title:'اتصال بالمورد لتأكيد الشحنة',project_id:p1.id,work_date:t,start_at:10*60,duration_min:30,estimate_min:30,priority:2});
  add({title:'مراجعة العقد وإرسال الملاحظات',project_id:p1.id,work_date:t,estimate_min:45,priority:1,deadline:addDays(t,1),checklist:[{text:'قراءة البند 4',done:true},{text:'صياغة الملاحظات',done:false}]});
  add({title:'كتابة ملخص الأسبوع',project_id:p2.id,work_date:t,estimate_min:20});
  add({title:'قراءة 20 صفحة',project_id:p3.id,work_date:t,estimate_min:25,repeat:{rule:'daily',from:'done'}});
  add({title:'تحديث صور المنتجات في الصفحة',project_id:p2.id,work_date:addDays(t,-1),estimate_min:60});
  add({title:'تقرير الربع للجمعية',deadline:addDays(t,-2),estimate_min:90,priority:1});
  add({title:'الرد على بريد المحاسب',tags:['انتظار'],estimate_min:10});
  add({title:'فكرة صفحة هبوط جديدة',project_id:p2.id,bucket:'later',estimate_min:120});
  add({title:'تعلّم تصميم الحركة',bucket:'someday'});
  add({title:'حجز موعد الصيانة',estimate_min:10});
  add({title:'اجتماع الفريق الأسبوعي',work_date:addDays(t,2),start_at:11*60,duration_min:60,repeat:{rule:'weekly',from:'due'}});
  S.events=[{id:uid(),title:'اجتماع مجلس الجمعية',date:t,allDay:false,start:13*60,end:14*60},{id:uid(),title:'مراجعة الطبيب',date:addDays(t,1),allDay:false,start:9*60+30,end:10*60+30},{id:uid(),title:'إجازة',date:addDays(t,4),allDay:true,start:null,end:null}];S.meta.icsName='demo.ics';
  const d=add({title:'ترتيب ملفات المشروع',project_id:p2.id,work_date:t,estimate_min:15,status:'done',done_at:new Date().toISOString(),actual_min:12});
  S.sessions.push({id:uid(),task_id:d.id,started_at:new Date(Date.now()-3600000).toISOString(),minutes:12,kind:'focus'});
  ['تجربة إعلان قصير لمنتج X','سلسلة منشورات عن رحلة المنتج','هل نحتاج نشرة بريدية؟'].forEach((x,i)=>S.ideas.push({id:uid(),text:x,created_at:new Date(Date.now()-i*7200000).toISOString(),archived:false,snooze:null}));
  S.outcomes[t]=['إرسال ملاحظات العقد','إغلاق ملف المورد',''];
  S.meta.seeded=true;save();render();toast('أُضيفت بيانات تجريبية');
}

/* ---------- تهيئة ---------- */
$('#openCmd').onclick=openCmd;
$('#focusBtn').onclick=()=>{if(U.focus)stopFocus();else startFocus(U.sel||dayTasks(today()).find(x=>x.status==='open')?.id);};
$('#helpBtn').onclick=helpModal;$('#settingsBtn').onclick=settingsModal;
$('#fab').onclick=()=>openCapture();
$('#moreTab').onclick=()=>openCmd();
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!g.closest('#main')){go(g.dataset.go);U.panelOpen=false;}});
load();nightlyArchive();
if(!location.hash)location.hash='#/day';
route();
syncInit();
setInterval(()=>{if(U.route==='#/timeline'&&!U.dragId)renderMain();},60000);
</script>
