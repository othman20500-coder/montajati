<title>Portfolio Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
  :root{
    --bg:#EEF3EE;        /* عاجي بميل أخضر */
    --card:#FFFFFF;
    --ink:#10241D;       /* نص داكن أخضر */
    --muted:#5C7068;
    --line:#D6E0D8;
    --green:#0F5F4C;     /* زمردي: اللون الأساسي */
    --green-2:#0B4B3C;
    --green-soft:#DCEBE4;
    --saffron:#E9A23B;   /* زعفراني: التمييز */
    --saffron-soft:#FBEBD2;
    --ok:#1F9D6A; --wip:#D08A1E; --arch:#7A8A83;
    --head:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;
    --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.85;padding-inline:20px;padding-block:0 72px}
  .wrap{direction:rtl;max-width:1080px;margin-inline:auto}
  a{color:inherit;text-decoration:none}
  a:focus-visible,button:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

  /* رأس ملوّن */
  .band{background:linear-gradient(135deg,var(--green) 0%,var(--green-2) 100%);color:#fff;border-radius:0 0 22px 22px;padding:56px 32px 40px;margin-inline:-20px;position:relative;overflow:hidden}
  .band::after{content:"";position:absolute;inset-inline-start:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:var(--saffron);opacity:.18;filter:blur(20px)}
  .band .in{direction:rtl;max-width:1080px;margin-inline:auto;position:relative}
  .who{font-family:var(--head);font-weight:700;font-size:clamp(36px,6.5vw,64px);line-height:1.15;margin:0}
  .who span{color:var(--saffron)}
  .line{font-size:18px;font-weight:300;color:rgba(255,255,255,.82);max-width:58ch;margin:12px 0 0}
  .dock{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 0}
  .dock a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:14px;transition:background .2s,transform .2s}
  .dock a:hover{background:var(--saffron);color:var(--ink);transform:translateY(-2px)}
  .dock svg{width:16px;height:16px}

  section{padding-block:40px}
  h2{font-family:var(--head);font-weight:500;font-size:26px;margin:0 0 4px;color:var(--green-2)}
  .sub{color:var(--muted);margin:0 0 20px;font-size:15px}

  /* بطاقة المشروع */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(16,36,29,.04);transition:transform .25s,box-shadow .25s}
  .card:hover{transform:translateY(-4px);box-shadow:0 18px 36px -22px rgba(15,95,76,.45)}
  .shot{aspect-ratio:16/9;background:linear-gradient(135deg,var(--green-soft),#F6F1E6);position:relative;overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--green);font-size:13px;opacity:.7}
  .shot .st{position:absolute;top:10px;inset-inline-start:10px;font-size:11.5px;padding:3px 10px;border-radius:999px;background:#fff;color:var(--c);border:1px solid currentColor;display:inline-flex;align-items:center;gap:6px}
  .shot .st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .head{display:flex;align-items:center;gap:12px;padding:14px 16px 0}
  .logo{width:48px;height:48px;border-radius:12px;flex:none;background:var(--green-soft);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;padding:3px}
  .logo b{font-family:var(--head);font-size:20px;color:var(--green)}
  .head h3{font-family:var(--head);font-weight:500;font-size:19px;margin:0;line-height:1.3}
  .head small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
  .card p{margin:0;padding:8px 16px 0;color:var(--muted);font-size:14px;line-height:1.7;flex:1}
  .tech{display:flex;flex-wrap:wrap;gap:5px;padding:10px 16px 0}
  .tech span{font-size:11px;color:var(--green);background:var(--green-soft);padding:2px 8px;border-radius:4px;direction:ltr}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:13px;font-weight:500;padding:9px 6px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.open{background:var(--green);border-color:var(--green);color:#fff}
  .btn.open:hover{background:var(--green-2)}
  .btn.git:hover{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.dir:hover{background:var(--saffron-soft);border-color:var(--saffron);color:#7A4E0A}
  .btn[hidden]{display:none}
  .toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;direction:rtl;max-width:calc(100vw - 40px);text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .links a{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
  .links a small{color:var(--muted);font-size:12px}
  .links a:hover{border-color:var(--green)}
  .contact{display:flex;flex-wrap:wrap;gap:10px}
  .contact a{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px}
  .contact a.main{background:var(--saffron);border-color:var(--saffron);color:var(--ink);font-weight:600}
  footer{color:var(--muted);font-size:12px;padding-top:12px;direction:rtl}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="band"><div class="in" lang="ar">
  <h1 class="who">عثمان <span>· منتجاتي</span></h1>
  <p class="line">أبني منصات وأدوات رقمية عربية من الفكرة حتى الإطلاق: منظومات إدارية، تطبيقات أسرية وتدريبية، ومنتجات مالية شخصية.</p>
  <nav class="dock" id="dock" aria-label="روابط سريعة"></nav>
</div></div>

<div class="wrap" lang="ar">
<section id="projects">
  <h2>منتجاتي</h2>
  <p class="sub">سبعة منتجات رقمية، لكل منها شعاره وصورته وروابطه.</p>
  <div class="grid" id="grid"></div>
</section>

<section id="links-sec">

  <p class="sub">كل ما تعود إليه يوميًا.</p>

</section>

<section id="contact">
  <h2>تواصل</h2>
  <div class="contact" id="contact"></div>
</section>
<footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>

const ICON = {

  git:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A12 12 0 000 12.6c0 5.3 3.4 9.9 8.2 11.5.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.3 1.8 1.3 1.1 1.9 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.4-5.5-6.1 0-1.3.5-2.4 1.2-3.3-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.3a11.3 11.3 0 016 0C17.3 4.7 18.3 5 18.3 5c.7 1.6.3 2.9.1 3.2.8.9 1.2 2 1.2 3.3 0 4.7-2.8 5.8-5.5 6.1.4.4.8 1.1.8 2.3v3.4c0 .3.2.7.8.6A12 12 0 0024 12.6 12 12 0 0012 .5z"/></svg>',

const ST = { live:["مباشر","var(--ok)"], wip:["قيد العمل","var(--wip)"], concept:["مقترح","#3F6FB5"], archived:["مؤرشف","var(--arch)"] };
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isLocal = location.protocol === "file:";
const toFileUrl = (p) => "file:///" + p.replace(/\\/g, "/").split("/").map(encodeURIComponent).join("/");
let toastTimer;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2600); }

document.getElementById("dock").append(...DATA.dock.map(d => el(`<a href="${esc(d.href)}"${d.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${ICON[d.icon] || ""}${esc(d.label)}</a>`)));

const grid = document.getElementById("grid");
function initials(p){ return (p.en || p.name).trim().split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase(); }

function renderGrid(){
  grid.innerHTML = "";
  DATA.projects.forEach(p => {
    const [label, color] = ST[p.status] || ST.wip;
    const card = el(`<article class="card">
      <div class="shot">${p.shot ? `<img src="${esc(p.shot)}" alt="لقطة من ${esc(p.name)}">` : `<div class="ph">صورة من المشروع</div>`}<span class="st" style="--c:${color}">${label}</span></div>
      <div class="head">
        <div class="logo"${p.logoBg ? ` style="background:${esc(p.logoBg)};border-color:${esc(p.logoBg)}"` : ""}>${p.logo ? `<img src="${esc(p.logo)}" alt="شعار ${esc(p.name)}">` : `<b>${esc(initials(p))}</b>`}</div>
        <h3>${esc(p.name)}<small>${esc(p.en || "")}${p.en ? " · " : ""}${esc(p.domain)}</small></h3>
      </div>
      <p>${esc(p.desc)}</p>
      <div class="tech">${(p.tech||[]).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      <div class="acts">
        <a class="btn open" ${p.live ? `href="${esc(p.live)}" target="_blank" rel="noopener"` : "hidden"}>${ICON.open}فتح</a>
        <a class="btn git"  ${p.repo ? `href="${esc(p.repo)}" target="_blank" rel="noopener"` : "hidden"}>${ICON.git}GitHub</a>
        <a class="btn dir"  ${p.dir  ? `href="${toFileUrl(p.dir)}" title="${esc(p.dir)}"` : "hidden"}>${ICON.folder}المجلد</a>
      </div></article>`);
    const dirBtn = card.querySelector(".btn.dir");
    if (p.dir && !isLocal) dirBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      try { await navigator.clipboard.writeText(p.dir); toast("تم نسخ مسار المجلد. الصقه في شريط عنوان Explorer."); }
      catch { toast(p.dir); }
    });
    grid.append(card);
  });
}
renderGrid();

document.getElementById("links").append(...DATA.links.map(l => el(`<a href="${esc(l.href)}" target="_blank" rel="noopener"><span>${esc(l.label)}</span><small>${esc(l.note)}</small></a>`)));
