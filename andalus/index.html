<!doctype html>
<html lang="ar" dir="rtl" data-theme="zellij" data-audience="general">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأندلس: نموذج تصوري</title>
<meta name="description" content="نموذج تفاعلي لتصور منصة الأندلس الرقمية: خريطة زمنية، خط زمني، صفحات كيانات مترابطة، ثلاثة اتجاهات بصرية، ونظام ادعاء ومصدر.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&family=Tajawal:wght@300;400;500;700&display=swap">
<style>
  /* ===== الرموز الوظيفية الثابتة عبر السمات ===== */
  :root{
    --fact:#1F9D6A; --disputed:#D08A1E; --inference:#3F6FB5; --myth:#8A8F98;
    --era-wulat:#8C6D3F; --era-imara:#2E7D5B; --era-khilafa:#1F5FA8; --era-tawaif:#B2632B;
    --era-murabit:#5B3F8C; --era-muwahhid:#8C2F39; --era-nasrid:#B8912E; --era-morisco:#5C6B73;
    --christian:#C9C2B3;
    --r-s:8px; --r-m:14px; --r-l:24px; --ease:cubic-bezier(.2,.7,.2,1);
  }
  /* ===== الاتجاه ب: الزليج (الأساس) ===== */
  :root, :root[data-theme="zellij"]{
    --bg:#F7F5EF; --card:#FFFFFF; --ink:#14202E; --muted:#5B6673; --line:#DCD8CC;
    --brand:#173F7A; --brand-2:#1E9C8B; --accent:#E4B33B; --soft:#E6EEF7;
    --head:"Reem Kufi","IBM Plex Sans Arabic",sans-serif; --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
    --pattern:radial-gradient(circle at 1px 1px, rgba(23,63,122,.08) 1px, transparent 0); --pattern-size:22px 22px;
    --hero-bg:linear-gradient(135deg,#173F7A 0%,#1E9C8B 100%); --hero-ink:#fff;
    --shadow:0 18px 36px -22px rgba(23,63,122,.45); color-scheme:light;
  }
  /* ===== الاتجاه أ: المخطوط ===== */
  :root[data-theme="manuscript"]{
    --bg:#F4ECDC; --card:#FBF6EA; --ink:#2B1D12; --muted:#6E5A46; --line:#D9CBB2;
    --brand:#1F4E79; --brand-2:#9B2D20; --accent:#B5893A; --soft:#EFE3CB;
    --head:"Amiri","Noto Naskh Arabic",serif; --body:"Noto Naskh Arabic","Amiri",serif;
    --pattern:linear-gradient(transparent 31px, rgba(43,29,18,.06) 32px); --pattern-size:100% 32px;
    --hero-bg:linear-gradient(135deg,#EADBBE 0%,#F4ECDC 100%); --hero-ink:#2B1D12;
    --shadow:0 18px 36px -22px rgba(43,29,18,.4); color-scheme:light;
  }
  :root[data-theme="manuscript"] body{font-size:17.5px}
  :root[data-theme="manuscript"] .card,:root[data-theme="manuscript"] .panel{border:1px solid var(--accent);outline:3px double var(--line);outline-offset:-6px}
  /* ===== الاتجاه ج: الليل الأندلسي ===== */
  :root[data-theme="night"]{
    --bg:#0E1420; --card:#151D2B; --ink:#DCE3EA; --muted:#94A0AE; --line:#26303F;
    --brand:#C77D3A; --brand-2:#4E6B4A; --accent:#E3A65A; --soft:#1B2536;
    --head:"Tajawal","IBM Plex Sans Arabic",sans-serif; --body:"Tajawal","IBM Plex Sans Arabic",sans-serif;
    --pattern:radial-gradient(ellipse at 50% 0%, rgba(199,125,58,.14), transparent 60%); --pattern-size:100% 100%;
    --hero-bg:radial-gradient(ellipse at 30% 20%, #2B2418 0%, #0E1420 60%); --hero-ink:#F1E9DC;
    --shadow:0 30px 50px -30px rgba(0,0,0,.8); color-scheme:dark;
  }
  :root[data-theme="night"] body{font-size:17px}
  :root[data-theme="night"] h1,:root[data-theme="night"] h2{font-weight:700;letter-spacing:.01em}

  *{box-sizing:border-box} html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg) var(--pattern);background-size:var(--pattern-size);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.85;padding-inline:16px;padding-block:0 64px;transition:background .4s,color .4s}
  a{color:inherit;text-decoration:none} button{font:inherit;cursor:pointer;color:inherit}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [hidden]{display:none!important}
  .wrap{max-width:1140px;margin-inline:auto}
  h1,h2,h3,h4{font-family:var(--head);font-weight:500;line-height:1.3;margin:0}
  h2{font-size:26px;color:var(--brand)} h3{font-size:19px}
  .eyebrow{font-size:12.5px;letter-spacing:.04em;color:var(--brand-2);font-weight:600;margin:0 0 6px}
  .sub{color:var(--muted);margin:6px 0 20px;max-width:64ch}
  section{padding-block:40px;border-bottom:1px solid var(--line)} section:last-of-type{border-bottom:0}

  /* ===== الترويسة ===== */
  .top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
  .top .in{max-width:1140px;margin-inline:auto;display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap}
  .brand{font-family:var(--head);font-weight:700;font-size:21px;color:var(--brand);display:inline-flex;align-items:center;gap:8px}
  .brand i{width:12px;height:12px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
  .nav{display:flex;gap:2px;flex-wrap:wrap}
  .nav a{padding:6px 11px;border-radius:var(--r-s);font-size:14px;color:var(--muted)}
  .nav a.on,.nav a:hover{background:var(--soft);color:var(--brand)}
  .tools{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
  .kbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-s);padding:6px 10px;font-size:13px;color:var(--muted)}
  .kbtn kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}

  /* ===== البطل ===== */
  .hero{position:relative;overflow:hidden;margin-inline:-16px;padding:56px 16px 40px;background:var(--hero-bg);color:var(--hero-ink);border-radius:0 0 var(--r-l) var(--r-l)}
  .hero .in{max-width:1140px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
  @media (max-width:860px){.hero .in{grid-template-columns:1fr}}
  .hero h1{font-size:clamp(32px,5.5vw,56px);font-weight:700;line-height:1.2}
  .hero h1 b{color:var(--accent);font-weight:700}
  .hero p{font-weight:300;font-size:17px;opacity:.85;max-width:56ch;margin:12px 0 0}
  .hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 20px;font-weight:600;font-size:14.5px;background:var(--accent);color:#14202E}
  .btn.ghost{background:transparent;color:inherit;border-color:currentColor;opacity:.9}
  .hero .mapbox{background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-m);padding:10px}
  :root[data-theme="manuscript"] .hero .mapbox{background:rgba(43,29,18,.05);border-color:var(--accent)}

  /* ===== شريط الزمن ===== */
  .timebar{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:12px}
  .timebar input[type=range]{width:100%;accent-color:var(--accent)}
  .timebar .year{font-family:var(--head);font-size:22px;min-width:150px;text-align:center}
  .timebar .year small{display:block;font-family:var(--body);font-size:12px;opacity:.75}
  .eras{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-top:6px}
  .eras span{display:block;height:100%}
  .eralegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;opacity:.9}
  .eralegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}

  /* ===== الخريطة ===== */
  .map{width:100%;height:auto;display:block}
  .map .land{fill:color-mix(in srgb,var(--card) 70%,var(--soft));stroke:var(--line);stroke-width:1.2}
  :root[data-theme="night"] .map .land{fill:#1B2536;stroke:#34405A}
  .map .sea{fill:transparent}
  .map .frontier{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;opacity:.85}
  .map .city{cursor:pointer}
  .map .city circle{stroke:#fff;stroke-width:1.5;transition:r .3s var(--ease),fill .4s}
  .map .city text{font-family:var(--body);font-size:11px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
  .map .city.dim{opacity:.18}
  .map .battle{cursor:pointer}
  .map .battle path{fill:var(--disputed);stroke:#fff;stroke-width:1}
  .map .note{font-size:10.5px;fill:var(--muted);font-family:var(--body)}
  .hero .map text{fill:var(--hero-ink);stroke:none}

  /* ===== البطاقات ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;transition:transform .3s var(--ease),box-shadow .3s;position:relative}
  a.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .card .type{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .card .type i{width:8px;height:8px;border-radius:2px;background:var(--c,var(--brand));display:inline-block}
  .card h3{margin-top:4px;color:var(--brand)}
  .card .d{font-size:13px;color:var(--muted)}
  .card p{margin:6px 0 0;font-size:14px;color:var(--ink);opacity:.9}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:18px}
  .cols{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
  @media (max-width:860px){.cols{grid-template-columns:1fr}}

  /* ===== شارة الادعاء ولوحة المصدر ===== */
  .claim{position:relative}
  .claim .b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-start:4px;vertical-align:middle;cursor:pointer;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
  .b.fact{background:var(--fact)} .b.disputed{background:var(--disputed)} .b.inference{background:var(--inference)} .b.myth{background:var(--myth)}
  .prov{position:fixed;inset-inline-start:0;inset-block:0;width:min(420px,100%);background:var(--card);border-inline-end:1px solid var(--line);box-shadow:var(--shadow);z-index:80;padding:22px;overflow:auto;transform:translateX(100%);transition:transform .35s var(--ease)}
  html[dir=ltr] .prov{transform:translateX(-100%)}
  .prov.open{transform:none!important}
  .prov h3{color:var(--brand);margin-bottom:6px}
  .prov .st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid currentColor;margin-bottom:12px}
  .prov .x{position:absolute;top:14px;inset-inline-end:14px;border:1px solid var(--line);background:transparent;border-radius:999px;width:32px;height:32px}
  .src{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;margin-top:10px;font-size:13.5px;background:var(--soft)}
  .src b{display:block;color:var(--brand)}
  .src q{display:block;color:var(--muted);font-style:italic;margin-top:4px}
  .tier{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;border:1px solid var(--line);margin-inline-start:6px}
  .counter{border-inline-start:3px solid var(--disputed);padding-inline-start:10px;margin-top:12px;font-size:13.5px}
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s}
  .veil.on{opacity:1;pointer-events:auto}

  /* ===== شريط العصر ===== */
  .ribbon{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--era,var(--brand));border-radius:var(--r-m);padding:10px 14px;font-size:13.5px;margin-bottom:18px}
  .ribbon b{font-family:var(--head);font-size:16px;color:var(--brand)}
  .ribbon .dual{color:var(--muted)}
  .rail h3{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:17px}
  .rail h3 i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13.5px;background:var(--card);transition:border-color .2s,transform .2s}
  .chip:hover{border-color:var(--brand);transform:translateY(-2px)}
  .chip small{color:var(--muted)}
  .names{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13.5px}
  .names b{color:var(--ink);font-weight:500}
  .tl{position:relative;padding-inline-start:18px;border-inline-start:2px solid var(--line);display:grid;gap:12px;margin-top:10px}
  .tl div{position:relative;font-size:14px}
  .tl div::before{content:"";position:absolute;inset-inline-start:-24px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--era,var(--brand));border:2px solid var(--card)}
  .tl b{color:var(--brand);font-weight:600}
  .tl small{color:var(--muted)}

  /* ===== الخط الزمني السينمائي ===== */
  .strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 4px 18px}
  .strip .card{min-width:260px;scroll-snap-align:start;border-top:6px solid var(--era)}
  .density{display:inline-flex;gap:4px}
  .density button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
  .density button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

  /* ===== الجمهور ===== */
  .kids-only,.scholar-only{display:none}
  :root[data-audience="kids"] .kids-only{display:block}
  :root[data-audience="kids"] .general-only,:root[data-audience="kids"] .scholar-only{display:none}
  :root[data-audience="scholar"] .scholar-only{display:block}
  :root[data-audience="kids"] body{font-size:18px}
  :root[data-audience="kids"] .card h3{font-size:22px}
  .scholar-box{border:1px dashed var(--line);border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;color:var(--muted);margin-top:12px}

  /* ===== البحث ===== */
  .cmd{position:fixed;inset:0;z-index:90;display:none;place-items:start center;padding-top:12vh;background:rgba(0,0,0,.45)}
  .cmd.on{display:grid}
  .cmd .box{width:min(640px,94vw);background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--shadow)}
  .cmd input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:inherit;font-size:17px;background:transparent;color:inherit;outline:0}
  .cmd .res{max-height:50vh;overflow:auto}
  .cmd .res a{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
  .cmd .res a:hover{background:var(--soft)}
  .cmd .res a i{width:8px;height:8px;border-radius:2px;background:var(--c);display:inline-block}
  .cmd .res small{color:var(--muted);margin-inline-start:auto}

  /* ===== نظام التصميم ===== */
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .sw{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;font-size:12px;background:var(--card)}
  .sw i{display:block;height:44px}
  .sw span{display:block;padding:6px 8px;color:var(--muted)}
  .spec{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
  .spec b{color:var(--brand);font-weight:600}
  .wire{border:2px dashed var(--line);border-radius:var(--r-m);padding:12px;background:var(--card);font-size:12.5px;color:var(--muted);display:grid;gap:8px}
  .wire div{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--soft)}
  .wire .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;padding:0;background:transparent}
  .note{font-size:12.5px;color:var(--muted);border-inline-start:3px solid var(--accent);padding-inline-start:10px;margin-top:12px}
  .game{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
  .game .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .game .opts button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 14px}
  .game .opts button.ok{background:var(--fact);color:#fff;border-color:var(--fact)}
  .game .opts button.no{background:var(--disputed);color:#fff;border-color:var(--disputed)}
  footer{color:var(--muted);font-size:13px;padding-top:24px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media print{.top,.prov,.veil,.cmd{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="in">
    <a class="brand" href="#/"><i></i> الأندلس <small style="font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)">نموذج تصوري</small></a>
    <nav class="nav" id="nav">
      <a href="#/map">الخريطة</a><a href="#/timeline">الزمن</a><a href="#/people">الأشخاص</a><a href="#/places">الأماكن</a><a href="#/museum">المتحف</a><a href="#/stories">القصص</a><a href="#/play">ألعاب</a><a href="#/design">نظام التصميم</a>
    </nav>
    <div class="tools">
      <div class="seg" id="theme" title="الاتجاه البصري">
        <button data-t="zellij" aria-pressed="true">الزليج</button><button data-t="manuscript" aria-pressed="false">المخطوط</button><button data-t="night" aria-pressed="false">الليل</button>
      </div>
      <div class="seg" id="aud" title="الجمهور">
        <button data-a="kids" aria-pressed="false">استكشاف</button><button data-a="general" aria-pressed="true">عام</button><button data-a="scholar" aria-pressed="false">باحث</button>
      </div>
      <button class="kbtn" id="kbtn">ابحث <kbd>⌘K</kbd></button>
    </div>
  </div></header>

  <main id="app"></main>

  <footer>
    نموذج تصوري لمنصة الأندلس الرقمية · البيانات هنا توضيحية لعرض النموذج، وكل ادعاء فيها يمر بسجل الادعاءات قبل أي نشر فعلي · جزء من مشروع «منتجاتي».
  </footer>
</div>

<div class="veil" id="veil"></div>
<aside class="prov" id="prov" aria-label="كيف نعرف هذا؟"></aside>
<div class="cmd" id="cmd"><div class="box"><input id="q" placeholder="ابحث في الأشخاص والأماكن والأحداث والوثائق… أو اكتب سنة مثل 1085"><div class="res" id="res"></div></div></div>

<script>
/* =========================================================
   البيانات التوضيحية للنموذج. البنية تطابق data/schema.json.
   ملاحظة منهجية: التواريخ هنا من مراجع قياسية (EI2، Kennedy 1996، Harvey 1990/2005)
   وتُعامل في المنصة الفعلية كادعاءات تمر بسجل الادعاءات والمراجعة قبل النشر.
   ========================================================= */
const ERAS = [
  { id:"era:wulat",    name:"الفتح والولاة",        from:711,  to:756,  c:"var(--era-wulat)" },
  { id:"era:imara",    name:"الإمارة الأموية",        from:756,  to:929,  c:"var(--era-imara)" },
  { id:"era:khilafa",  name:"خلافة قرطبة",           from:929,  to:1031, c:"var(--era-khilafa)" },
  { id:"era:tawaif",   name:"ملوك الطوائف",          from:1031, to:1091, c:"var(--era-tawaif)" },
  { id:"era:murabit",  name:"المرابطون",             from:1091, to:1147, c:"var(--era-murabit)" },
  { id:"era:muwahhid", name:"الموحدون والطوائف الثالثة", from:1147, to:1238, c:"var(--era-muwahhid)" },
  { id:"era:nasrid",   name:"مملكة غرناطة",          from:1238, to:1492, c:"var(--era-nasrid)" },
  { id:"era:morisco",  name:"المدجنون والموريسكيون", from:1492, to:1614, c:"var(--era-morisco)" },

const EDGES=[]; Object.values(E).forEach(o=>(o.edges||[]).forEach(([rel,to,role])=>EDGES.push({from:o.id,rel,to,role})));

Object.values(E).filter(o=>o.type==="Work").forEach(w=>EDGES.push({from:w.author,rel:"authored",to:w.id}));
const REL={ruled:"حكم",born_in:"وُلد في",died_in:"توفي في",lived_in:"عاش في",participated_in:"شارك في",authored:"ألّف",patron_of:"رعى",took_place_at:"وقع في"};
const TYPE={Person:["شخص","var(--era-khilafa)"],Place:["مكان","var(--era-imara)"],Event:["حدث","var(--era-muwahhid)"],Polity:["دولة","var(--era-murabit)"],Document:["وثيقة","var(--era-wulat)"],Work:["مصنَّف","var(--era-tawaif)"],Artifact:["أثر","var(--era-nasrid)"]};

/* ===== أدوات ===== */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hijri=g=>Math.round((g-622)*33/32); // تقريب للنموذج فقط؛ المنصة تخزّن التاريخين معًا
const dual=(g,e)=>`${g}م / ${hijri(g)}هـ${e?` – ${e}م / ${hijri(e)}هـ`:""} <small title="التقويم الهجري هنا تقريبي في النموذج">≈</small>`;
const eraOf=y=>ERAS.find(e=>y>=e.from&&y<e.to)||ERAS[ERAS.length-1];
const href=id=>`#/${id.split(":")[0]}/${id.split(":")[1]}`;
const claimSpan=(text,cid)=>{const c=CLAIMS[cid];return `<span class="claim">${esc(text)}<i class="b ${c?c.status:"myth"}" data-c="${cid}" title="كيف نعرف هذا؟" role="button" tabindex="0"></i></span>`;};
const summaryHtml=o=>(o.summary||[]).map(([t,c])=>claimSpan(t,c)).join(" ");
const card=o=>{const [tn,tc]=TYPE[o.type]||["",""];const d=o.type==="Person"?`${o.born}–${o.died}م`:o.type==="Event"?dual(o.year,o.end):o.type==="Polity"?`${o.from}–${o.to}م`:o.year?`${o.year}م`:o.kind||"";
  return `<a class="card" href="${href(o.id)}" style="--c:${tc}"><div class="type"><i></i>${tn}</div><h3>${esc(o.name.ar)}</h3><div class="d">${d}</div><p>${(o.summary||[]).slice(0,1).map(([t])=>esc(t)).join("")}</p></a>`;};
const chip=id=>{const o=E[id];if(!o)return `<span class="chip">${esc(id)}</span>`;return `<a class="chip" href="${href(id)}">${esc(o.name.ar)} <small>${TYPE[o.type][0]}</small></a>`;};
const related=id=>{const out={};EDGES.forEach(e=>{if(e.from===id){(out[E[e.to]?.type]??=[]).push({id:e.to,rel:REL[e.rel]||e.rel,role:e.role});}if(e.to===id){(out[E[e.from]?.type]??=[]).push({id:e.from,rel:REL[e.rel]||e.rel,role:e.role,rev:true});}});return out;};
const rail=id=>{const r=related(id);const order=["Person","Place","Event","Polity","Work","Document","Artifact"];return `<div class="rail">${order.filter(t=>r[t]?.length).map(t=>`<h3 style="--c:${TYPE[t][1]}"><i></i>${TYPE[t][0]}</h3><div class="chips">${r[t].map(x=>`<a class="chip" href="${href(x.id)}">${esc(E[x.id].name.ar)} <small>${x.rev?"":x.rel} ${x.role?"· "+esc(x.role):""}</small></a>`).join("")}</div>`).join("")}</div>`;};
const ribbon=(y,e)=>{const er=eraOf(y);return `<div class="ribbon" style="--era:${er.c}"><b>${er.name}</b><span class="dual">${dual(y,e)}</span><a href="#/timeline?y=${y}" class="chip">افتح على خط الزمن</a><a href="#/map?y=${y}" class="chip">افتح على الخريطة</a></div>`;};
const audienceBox=o=>`${o.kids?`<div class="kids-only panel" style="margin-top:14px;font-size:18px">🧭 ${esc(o.kids)}</div>`:""}${o.scholar?`<div class="scholar-only scholar-box">ملاحظة للباحث: ${esc(o.scholar)}</div>`:""}<div class="scholar-only scholar-box">أدوات الباحث: <a href="#" onclick="return false">تصدير JSON</a> · <a href="#" onclick="return false">BibTeX</a> · <a href="#" onclick="return false">تاريخ التعديلات</a> · <a href="#" onclick="return false">الإبلاغ عن خطأ</a> · المعرّفات: Wikidata، VIAF، PUA (تُضاف عند المواءمة)</div>`;

/* ===== الخريطة ===== */
const X=lon=>(lon+10)*60, Y=lat=>(44-lat)*65;
const IBERIA=[[-1.8,43.4],[-3.8,43.5],[-5.7,43.6],[-7.7,43.8],[-9.3,43.0],[-8.9,42.0],[-8.7,41.2],[-9.4,39.4],[-9.5,38.7],[-8.8,37.9],[-9.0,37.0],[-7.4,37.2],[-6.9,37.2],[-6.3,36.6],[-5.6,36.0],[-5.3,36.1],[-4.4,36.7],[-2.5,36.8],[-1.9,37.2],[-0.7,37.6],[-0.5,38.4],[0.2,38.8],[-0.3,39.5],[0.9,41.0],[2.2,41.4],[3.2,42.3],[3.0,42.7],[0.5,42.8]];
const MAGHREB=[[-10,33.2],[-9.8,33.6],[-8.5,33.3],[-7.6,33.6],[-6.8,34.0],[-6.3,35.2],[-5.9,35.8],[-5.3,35.9],[-4.4,35.2],[-2.9,35.3],[-1.9,35.1],[-0.6,35.7],[0.3,36.1],[1.5,36.5],[3.0,36.8],[4,36.9],[4,33.2]];
// خطوط حدود تقريبية توضيحية للنموذج فقط (ليست بيانات موثقة): [سنة، نقاط]
const FRONTIERS=[[750,[[-9.0,43.2],[-6,43.0],[-3,42.9],[0,42.6],[3,42.4]]],[900,[[-9.2,41.4],[-6,41.3],[-3,41.6],[-1.5,42.4],[0.5,41.8],[3.1,42.2]]],[1000,[[-9.2,41.2],[-6,41.2],[-3,41.4],[-1.5,42.2],[0.5,41.6],[3.1,42.0]]],[1090,[[-9.3,39.6],[-6.5,39.8],[-4.5,40.1],[-2.8,40.6],[-1,41.5],[0.4,41.3],[3.1,42.0]]],[1150,[[-9.3,39.2],[-7,39.4],[-4.5,39.6],[-2.5,39.8],[-0.4,40.0],[0.9,40.6]]],[1230,[[-9.0,37.2],[-7,37.9],[-5,38.2],[-3.5,38.4],[-1.5,38.6],[-0.3,39.4]]],[1260,[[-6.2,36.6],[-5.2,36.9],[-4.4,37.4],[-3.0,37.6],[-2.0,37.4],[-1.7,36.9]]],[1492,null]];
function frontierFor(y){let f=null;for(const [yr,pts] of FRONTIERS){if(y>=yr)f=pts;}return f;}
function ctrl(o,y){for(const [a,b,w] of (o.control||[])){if(y>=a&&y<b)return w;}return null;}
function mapSvg(y,opts={}){
  const path=pts=>pts.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("")+"Z";
  const fr=frontierFor(y);
  const cities=Object.values(E).filter(o=>o.type==="Place"&&!o.battle);
  const battles=Object.values(E).filter(o=>o.type==="Place"&&o.battle);
  return `<svg class="map" viewBox="0 0 840 700" role="img" aria-label="خريطة الأندلس سنة ${y}">
    <path class="land" d="${path(IBERIA)}"/><path class="land" d="${path(MAGHREB)}"/>
    ${fr?`<path class="frontier" d="${fr.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("")}"/>`:""}
    ${cities.map(o=>{const c=ctrl(o,y);const exists=y>=o.founded;const fill=c==="muslim"?eraOf(y).c:c==="christian"?"var(--christian)":"var(--muted)";
      return `<a class="city ${exists?"":"dim"}" href="${href(o.id)}"><circle cx="${X(o.lon)}" cy="${Y(o.lat)}" r="${o.id==="pl:cordoba"||o.id==="pl:granada"||o.id==="pl:seville"?8:5.5}" fill="${fill}"/><text x="${X(o.lon)+9}" y="${Y(o.lat)+4}">${esc(o.name.ar)}</text></a>`;}).join("")}
    ${battles.filter(b=>Math.abs(b.founded-y)<=40).map(b=>`<a class="battle" href="${href(b.id)}"><path d="M${X(b.lon)},${Y(b.lat)-8} l7,12 h-14z"/><text x="${X(b.lon)+9}" y="${Y(b.lat)+4}" class="note">⚔ ${esc(b.name.ar)} ${b.founded}</text></a>`).join("")}
    <text x="12" y="688" class="note">الحدود خط تقريبي توضيحي في النموذج؛ في المنصة تُبنى من علاقات controlled_by الموثقة وتُوسم بدرجة اليقين.</text>
  </svg>`;
}
const erasBar=()=>`<div class="eras">${ERAS.map(e=>`<span style="width:${(e.to-e.from)/(1614-711)*100}%;background:${e.c}" title="${e.name}"></span>`).join("")}</div><div class="eralegend">${ERAS.map(e=>`<span><i style="background:${e.c}"></i>${e.name} ${e.from}–${e.to}</span>`).join("")}</div>`;
const timeBar=(y,id)=>`<div class="timebar"><span>711</span><input type="range" min="711" max="1614" value="${y}" id="${id}" aria-label="السنة"><span>1614</span></div><div class="year" id="${id}-y" style="text-align:center;font-family:var(--head);font-size:22px;margin-top:6px">${y}م <small style="font-family:var(--body);font-size:12px;opacity:.75">${hijri(y)}هـ تقريبًا · ${eraOf(y).name}</small></div>${erasBar()}`;
function yearSnapshot(y){const evs=Object.values(E).filter(o=>o.type==="Event").sort((a,b)=>Math.abs(a.year-y)-Math.abs(b.year-y)).slice(0,3);const rulers=Object.values(E).filter(o=>o.type==="Polity"&&y>=o.from&&y<o.to);const people=Object.values(E).filter(o=>o.type==="Person"&&y>=o.born&&y<=o.died);
  return `<div class="panel"><p class="eyebrow">ماذا كان يحدث سنة ${y}م؟</p><div class="chips">${rulers.map(r=>chip(r.id)).join("")||"<span class='chip'>لا دولة إسلامية مسجلة في النموذج لهذه السنة</span>"}</div><h3 style="margin-top:12px">أقرب الأحداث</h3><div class="chips">${evs.map(e=>`<a class="chip" href="${href(e.id)}">${esc(e.name.ar)} <small>${e.year}م</small></a>`).join("")}</div><h3 style="margin-top:12px">أحياء في هذه السنة</h3><div class="chips">${people.map(p=>chip(p.id)).join("")||"<span class='chip'>لا أشخاص في النموذج لهذه السنة</span>"}</div></div>`;}

V.people=()=>`<section><p class="eyebrow">الأشخاص</p><h2>حكام وعلماء وأدباء</h2><div class="grid">${Object.values(E).filter(o=>o.type==="Person").sort((a,b)=>a.born-b.born).map(card).join("")}</div></section>`;
V.places=()=>`<section><p class="eyebrow">الأماكن</p><h2>مدن ومعالم وميادين</h2><div class="grid">${Object.values(E).filter(o=>o.type==="Place").map(card).join("")}</div></section>`;
V.museum=()=>`<section><p class="eyebrow">المتحف الرقمي</p><h2>الآثار والوثائق والمصنفات</h2><p class="sub">كل قطعة تحمل مكان حفظها الحالي ورخصة صورتها؛ لا تُعرض صورة بلا ترخيص واضح. في المنصة تُعرض المخطوطات عبر IIIF من مكتباتها مباشرة.</p><div class="grid">${Object.values(E).filter(o=>["Artifact","Document","Work"].includes(o.type)).map(card).join("")}</div></section>`;

V.stories=()=>{const scenes=[["دمشق، 750م","سقوط الأمويين في المشرق، وشاب من البيت الأموي ينجو.",null],["شمال إفريقيا، 750–755م","سنوات التخفي والترحال بين القبائل البربرية.","p:abdrahman1"],["المنكب، 755م","العبور إلى الأندلس.","pl:malaga"],["قرطبة، 756م","المعركة على قرطبة وتأسيس الإمارة.","e:emirate-756"]];
  return `<section><p class="eyebrow">رحلة سردية</p><h2>«الصقر»: من دمشق إلى قرطبة</h2><p class="sub">قصة من أربعة مشاهد. كل مشهد يشير إلى كيان في الرسم المعرفي، وتنتهي القصة بشاشة «ما الذي يقوله المؤرخون؟». (في المنصة الكاملة: شاشة كاملة لكل مشهد مع الخريطة والوسائط والصوت.)</p>
  <div class="strip">${scenes.map(([t,d,id],i)=>`<div class="card" style="--era:var(--era-imara);min-width:300px"><div class="type">مشهد ${i+1}</div><h3>${esc(t)}</h3><p>${esc(d)}</p>${id?`<div class="chips" style="margin-top:8px">${chip(id)}</div>`:""}</div>`).join("")}
  <div class="card" style="--era:var(--fact);min-width:300px"><div class="type">الخاتمة</div><h3>ما الذي يقوله المؤرخون؟</h3><p>${claimSpan("تأسيس الإمارة سنة 756م","c:emirate-756")} · تفاصيل الرحلة نفسها تعتمد على روايات لاحقة وتُعرض في المنصة بحالتها.</p></div></div>
  <div class="grid" style="margin-top:14px">${[["رحلة ابن جبير","مسار الرحلة على الخريطة مع مقتطفات من نصه."],["يوم سقطت الخلافة","الفتنة 1009–1031م بأصوات متعددة."],["الليلة الأخيرة في الحمراء","شروط التسليم ونصوصها."],["المفاتيح","الموريسكيون من التنصير القسري إلى الطرد."]].map(([t,d])=>`<div class="card"><div class="type">قصة قادمة</div><h3>${t}</h3><p>${d}</p></div>`).join("")}</div></section>`;};

V.play=()=>{const y=[800,960,1100,1300][Math.floor(Math.random()*4)];const ans=eraOf(y).name;const opts=[...new Set([ans,...ERAS.map(e=>e.name).sort(()=>Math.random()-.5).slice(0,3)])].sort(()=>Math.random()-.5);
  return `<section><p class="eyebrow">ألعاب معرفية</p><h2>كل سؤال يُبنى من الرسم المعرفي ويعرض مصدره</h2>
  <div class="grid">
    <div class="game"><div class="type">أين أنت؟</div><h3>سنة ${y}م، أنت في قرطبة. ما العصر؟</h3><div class="opts" id="g1">${opts.map(o=>`<button data-ok="${o===ans}">${o}</button>`).join("")}</div><p class="note" id="g1n">الإجابة مبنية على حدود العصور في النموذج (حالة: حقيقة مستقرة في المنصة بمصادرها).</p></div>
    <div class="game"><div class="type">رتّب الأحداث</div><h3>في المنصة: بطاقات تُسحب لترتيبها زمنيًا</h3><div class="chips">${["e:toledo-1085","e:zallaqa-1086","e:navas-1212","e:granada-1492"].map(chip).join("")}</div><p class="note">المصدر: حقل التاريخ في كل حدث.</p></div>
    <div class="game"><div class="type">من قال؟</div><h3>«طوق الحمامة» من مؤلفه؟</h3><div class="chips">${chip("p:ibnhazm")}${chip("p:averroes")}${chip("p:ibnkhatib")}</div><p class="note">المصدر: علاقة authored.</p></div>
    <div class="game"><div class="type">متحف الجيب</div><h3>اجمع القطع باستكشاف الأماكن</h3><div class="chips">${chip("a:mughira")}${chip("a:vase")}</div><p class="note">كل قطعة تحمل متحفها ورخصتها.</p></div>
  </div></section>`;};

V.design=()=>`<section><p class="eyebrow">نظام التصميم</p><h2>ثلاثة اتجاهات، رموز واحدة</h2><p class="sub">بدّل الاتجاه من الترويسة (الزليج / المخطوط / الليل) لترى الصفحة كلها تتغير. الألوان الوظيفية (حالات الادعاء والعصور) ثابتة عبر الاتجاهات كي لا يتغير معنى اللون.</p>
  <h3>ألوان الحالة</h3><div class="swatches"><div class="sw"><i style="background:var(--fact)"></i><span>حقيقة مستقرة</span></div><div class="sw"><i style="background:var(--disputed)"></i><span>مختلف عليها</span></div><div class="sw"><i style="background:var(--inference)"></i><span>استنتاج</span></div><div class="sw"><i style="background:var(--myth)"></i><span>شائعة غير مثبتة</span></div></div>
  <h3 style="margin-top:18px">ألوان العصور</h3><div class="swatches">${ERAS.map(e=>`<div class="sw"><i style="background:${e.c}"></i><span>${e.name}</span></div>`).join("")}</div>
  <h3 style="margin-top:18px">ألوان الاتجاه الحالي</h3><div class="swatches">${["--bg","--card","--ink","--muted","--brand","--brand-2","--accent","--soft"].map(v=>`<div class="sw"><i style="background:var(${v})"></i><span>${v}</span></div>`).join("")}</div>
  <h3 style="margin-top:18px">الخطوط</h3><div class="panel"><div style="font-family:var(--head);font-size:34px">عنوان: الأندلس بين التاريخ والرواية</div><div style="font-family:var(--body);font-size:16px">متن: في سنة 316هـ/929م أعلن عبد الرحمن الثالث الخلافة في قرطبة، وهو ما تتفق عليه المصادر الأساسية والدراسات الحديثة.</div></div>
  <h3 style="margin-top:18px">المكوّنات</h3><div class="spec"><b>EntityCard</b><span>بطاقة كيان: نوع، اسم، تاريخان، سطر</span><b>ClaimBadge</b><span>نقطة ملونة بعد الجملة تفتح لوحة المصدر</span><b>ProvenancePanel</b><span>«كيف نعرف هذا؟»: المصدر، الموضع، المرتبة، الأقوال المخالفة</span><b>EraRibbon</b><span>شريط العصر والسنة في أعلى كل صفحة كيان</span><b>TimeSlider</b><span>شريط الزمن 711–1614 يزامن الخريطة والقوائم</span><b>DualDate</b><span>التاريخ بالتقويمين مع درجة اليقين</span><b>RelationRail</b><span>قضبان الروابط المولَّدة من الحواف</span><b>AudienceSwitch</b><span>استكشاف / عام / باحث</span></div>
  <h3 style="margin-top:18px">Wireframes</h3>
  <div class="grid">
    <div class="wire"><b>الصفحة الرئيسية</b><div>ترويسة + مفاتيح الاتجاه والجمهور + ⌘K</div><div class="row"><div>H1 + شريط الزمن + مداخل</div><div>خريطة حية</div></div><div>«ماذا كان يحدث سنة …؟»</div><div>بطاقات المداخل الستة</div><div>كيف نتحقق؟</div></div>
    <div class="wire"><b>صفحة مدينة</b><div>EraRibbon</div><div class="row"><div>NameStack + ملخص بشارات + الحالة اليوم</div><div>خريطة مصغرة + صور مرخصة</div></div><div>شريط زمن المدينة</div><div>RelationRail: أشخاص · أحداث · وثائق · آثار</div><div>الخلافات والأساطير</div><div>المصادر · صدّر</div></div>
    <div class="wire"><b>صفحة شخصية</b><div>EraRibbon</div><div class="row"><div>الاسم والأدوار + ملخص</div><div>خريطة مسار الحياة</div></div><div>خط الحياة فوق الأحداث السياسية</div><div>الشيوخ والتلاميذ · المصنفات · المخطوطات · الأماكن</div><div>المصادر · المعرّفات</div></div>
    <div class="wire"><b>صفحة حدث</b><div>EraRibbon + التاريخ بشارة</div><div class="row"><div>ملخص + الأطراف</div><div>خريطة المعركة ▶ + تنبيه الأعداد</div></div><div>قبل ← بعد</div><div>الروايات: مصادر أولية وقراءات حديثة</div><div>RelationRail</div></div>
  </div></section>`;

V.entity=(id)=>{const o=E[id];if(!o)return `<section><h2>لم أجد هذا الكيان</h2><p class="sub"><a href="#/">العودة</a></p></section>`;const [tn,tc]=TYPE[o.type];
  let head="",extra="";
  if(o.type==="Place"){head=ribbon(state.y);extra=`<div class="cols"><div><div class="names"><b>${esc(o.name.ar)}</b>${o.name.lat?`<span>اللاتيني: ${esc(o.name.lat)}</span>`:""}${o.name.es?`<span>اليوم: ${esc(o.name.es)}</span>`:""}<span>${esc(o.kind)}</span><span>${o.lat.toFixed(2)}°, ${o.lon.toFixed(2)}°</span></div><p style="margin-top:10px">${summaryHtml(o)}</p>${audienceBox(o)}
      <h3 style="margin-top:18px">شريط زمن المكان</h3><div class="tl">${Object.values(E).filter(e=>e.type==="Event"&&e.place===id).sort((a,b)=>a.year-b.year).map(e=>`<div style="--era:${eraOf(e.year).c}"><b><a href="${href(e.id)}">${esc(e.name.ar)}</a></b> <small>${dual(e.year,e.end)}</small></div>`).join("")||"<div>لا أحداث في النموذج</div>"}</div></div>
      <div class="panel"><p class="eyebrow">الموقع سنة ${state.y}م</p>${mapSvg(state.y)}<p class="note">في المنصة: مخطط المدينة في السنة المختارة (المسجد، القصر، الأسوار) كطبقة فوق الخريطة الحالية، وصور IIIF مرخصة.</p></div></div>`;}
  else if(o.type==="Person"){head=ribbon(o.born,o.died);extra=`<div class="cols"><div><div class="names"><b>${esc(o.name.ar)}</b>${o.name.en?`<span>${esc(o.name.en)}</span>`:""}<span>${(o.roles||[]).join(" · ")}</span></div><p style="margin-top:10px">${summaryHtml(o)}</p>${audienceBox(o)}</div>
      <div class="panel"><p class="eyebrow">مسار الحياة</p>${mapSvg(o.born+20)}<p class="note">في المنصة: خط الرحلة بين أماكن الإقامة (born_in → lived_in → died_in) مع سنواتها، وشبكة الشيوخ والتلاميذ.</p></div></div>`;}
  else if(o.type==="Event"){head=ribbon(o.year,o.end);const parts=EDGES.filter(e=>e.to===id&&e.rel==="participated_in");extra=`<div class="cols"><div><p>${summaryHtml(o)}</p><h3 style="margin-top:14px">الأطراف</h3><div class="chips">${parts.map(p=>`<a class="chip" href="${href(p.from)}">${esc(E[p.from].name.ar)} <small>${esc(p.role||"")}</small></a>`).join("")||"<span class='chip'>تُستكمل</span>"}</div>
      ${(o.before||o.after)?`<h3 style="margin-top:14px">قبل ← بعد</h3><div class="chips">${(o.before||[]).map(chip).join("")}<span class="chip" style="border-color:var(--accent)">${esc(o.name.ar)}</span>${(o.after||[]).map(chip).join("")}</div>`:""}
      ${audienceBox(o)}</div><div class="panel"><p class="eyebrow">المكان</p>${mapSvg(o.year)}${o.kind==="معركة"?`<p class="note">خريطة المعركة على مراحل ▶ تُضاف في المنصة، مع تنبيه ثابت: أعداد الجيوش تُعرض كمدى بمصادره.</p>`:""}</div></div>`;}
  else {extra=`<p>${summaryHtml(o)}</p>${o.holding?`<div class="panel" style="margin-top:12px"><b>مكان الحفظ:</b> ${esc(o.holding.institution)}${o.holding.license?` · <b>الرخصة:</b> ${esc(o.holding.license)}`:""}${o.holding.iiif?` · IIIF`:` · <span class="scholar-only" style="display:inline">الرقم المكتبي ورابط IIIF يُضافان عند التوثيق</span>`}</div>`:""}${o.capital?`<div class="chips" style="margin-top:12px"><span class="chip">العاصمة: ${esc(E[o.capital].name.ar)}</span><span class="chip">${o.from}–${o.to}م</span></div>`:""}${audienceBox(o)}`;}
  return `<section><p class="eyebrow" style="color:${tc}">${tn}</p><h2>${esc(o.name.ar)}</h2>${head}${extra}${rail(id)}
  <h3 style="margin-top:22px">المصادر المستخدمة في هذه الصفحة</h3><div class="chips">${[...new Set((o.summary||[]).flatMap(([,c])=>(CLAIMS[c]?.sources||[]).map(s=>s.src)))].map(s=>`<span class="chip">${esc(SOURCES[s].author)}، ${esc(SOURCES[s].year)} <small>مرتبة ${SOURCES[s].tier}</small></span>`).join("")}</div>
  <p class="note">اقترح تصحيحًا · آخر مراجعة: 2026-09-21 (نموذج)</p></section>`;};

/* ===== لوحة المصدر ===== */
const STATUS={fact:["حقيقة مستقرة","var(--fact)"],disputed:["رواية مختلف عليها","var(--disputed)"],inference:["استنتاج","var(--inference)"],myth:["رواية شائعة غير مثبتة","var(--myth)"]};
function openProv(cid){const c=CLAIMS[cid];if(!c)return;const [sn,sc]=STATUS[c.status];
  document.getElementById("prov").innerHTML=`<button class="x" id="provX" aria-label="إغلاق">✕</button><p class="eyebrow">كيف نعرف هذا؟</p><h3>${esc(c.text)}</h3><span class="st" style="color:${sc}"><i class="b ${c.status}"></i>${sn}</span>
    ${c.sources.map(s=>{const S=SOURCES[s.src];return `<div class="src"><b>${esc(S.title)}<span class="tier">مرتبة ${S.tier}</span></b>${esc(S.author)} · ${esc(S.year)} · ${esc(S.pub)} · ${esc(S.kind)} · ${esc(S.lang)}<q>الموضع: ${esc(s.loc)}</q></div>`;}).join("")}
    ${c.counter.length?`<div class="counter"><b>الأقوال المخالفة</b>${c.counter.map(k=>`<p style="margin:6px 0">${esc(k.position)}<br><small style="color:var(--muted)">${k.sources.map(s=>esc(SOURCES[s.src].title)+" · "+esc(s.loc)).join(" ؛ ")}</small></p>`).join("")}</div>`:""}
    <p class="note">المراجع: فريق التحرير (نموذج) · آخر مراجعة 2026-09-21 · <a href="#" onclick="return false">الإبلاغ عن خطأ</a> · <a href="#" onclick="return false">نسخ الاستشهاد</a></p>
    <div class="scholar-only scholar-box">JSON للادعاء: <code>${esc(cid)}</code> · يُصدَّر مع المصادر بصيغة CSL-JSON في المنصة.</div>`;
  document.getElementById("prov").classList.add("open");document.getElementById("veil").classList.add("on");document.getElementById("provX").onclick=closeProv;}
function closeProv(){document.getElementById("prov").classList.remove("open");document.getElementById("veil").classList.remove("on");}
document.getElementById("veil").onclick=closeProv;
document.addEventListener("click",e=>{const b=e.target.closest(".b[data-c]");if(b){e.preventDefault();openProv(b.dataset.c);}});
document.addEventListener("keydown",e=>{const b=e.target.closest?.(".b[data-c]");if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openProv(b.dataset.c);}if(e.key==="Escape"){closeProv();document.getElementById("cmd").classList.remove("on");}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCmd();}});

/* ===== البحث ===== */
function openCmd(){const c=document.getElementById("cmd");c.classList.add("on");const q=document.getElementById("q");q.value="";q.focus();search("");}
document.getElementById("kbtn").onclick=openCmd;document.getElementById("cmd").onclick=e=>{if(e.target.id==="cmd")e.currentTarget.classList.remove("on");};
document.getElementById("q").oninput=e=>search(e.target.value);
function search(s){s=s.trim();const res=document.getElementById("res");if(/^\d{3,4}$/.test(s)){const y=+s;res.innerHTML=`<a href="#/map?y=${y}"><i style="--c:var(--accent)"></i>ماذا كان يحدث سنة ${y}م؟<small>الخريطة</small></a><a href="#/timeline?y=${y}"><i style="--c:var(--accent)"></i>سنة ${y}م على خط الزمن<small>الزمن</small></a>`;return;}
  const hits=Object.values(E).filter(o=>!s||o.name.ar.includes(s)||(o.name.en||"").toLowerCase().includes(s.toLowerCase())||(o.name.es||"").toLowerCase().includes(s.toLowerCase())).slice(0,12);
  res.innerHTML=hits.map(o=>`<a href="${href(o.id)}" style="--c:${TYPE[o.type][1]}"><i></i>${esc(o.name.ar)}<small>${TYPE[o.type][0]}</small></a>`).join("")||`<a href="#/"><i></i>لا نتائج<small></small></a>`;}
document.getElementById("res").onclick=()=>document.getElementById("cmd").classList.remove("on");

/* ===== السمات والجمهور ===== */
const state={y:960};
function seg(id,attr,key){const el=document.getElementById(id);el.onclick=e=>{const b=e.target.closest("button");if(!b)return;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));document.documentElement.setAttribute(attr,b.dataset[key]);try{localStorage.setItem(attr,b.dataset[key]);}catch(_){}};
  let saved=null;try{saved=localStorage.getItem(attr);}catch(_){}if(saved){document.documentElement.setAttribute(attr,saved);el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset[key]===saved));}}
seg("theme","data-theme","t");seg("aud","data-audience","a");

/* ===== التوجيه ===== */
function route(){const h=location.hash||"#/";const [path,qs]=h.slice(1).split("?");const q=Object.fromEntries(new URLSearchParams(qs||""));const seg=path.split("/").filter(Boolean);const app=document.getElementById("app");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#/"+(seg[0]||"")));
  let html="";
  if(!seg.length)html=V.home();
  else if(V[seg[0]]&&seg.length===1)html=V[seg[0]](q);
  else if(seg.length===2)html=V.entity(seg[0]+":"+seg[1]);
  else html=V.home();
  app.innerHTML=html;window.scrollTo({top:0});
  const bind=(id,onY)=>{const r=document.getElementById(id);if(!r)return;r.oninput=()=>{const y=+r.value;state.y=y;document.getElementById(id+"-y").innerHTML=`${y}م <small style="font-family:var(--body);font-size:12px;opacity:.75">${hijri(y)}هـ تقريبًا · ${eraOf(y).name}</small>`;onY(y);};};
  bind("heroY",y=>{document.getElementById("heroMap").innerHTML=mapSvg(y);document.getElementById("heroSnap").innerHTML=yearSnapshot(y);});
  bind("mapY",y=>{document.getElementById("mapBox").innerHTML=mapSvg(y);document.getElementById("mapSnap").innerHTML=yearSnapshot(y);document.getElementById("mapYear").textContent=y;});
  if(q.y)state.y=+q.y;
  const g=document.getElementById("g1");if(g)g.onclick=e=>{const b=e.target.closest("button");if(!b)return;g.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add(b.dataset.ok==="true"?"ok":"no");document.getElementById("g1n").innerHTML=(b.dataset.ok==="true"?"صحيح. ":"ليس كذلك. ")+"المصدر: حدود العصور في الرسم المعرفي (Kennedy 1996، EI2). في المنصة تُعرض شارة الادعاء هنا.";};
}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
