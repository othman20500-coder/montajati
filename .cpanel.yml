---
# وصفة نشر منصة الأندلس على cPanel عبر Git™ Version Control.
# تُشغَّل هذه المهام عند الضغط على «Update from Remote» ثم «Deploy HEAD Commit» في cPanel،
# أو تلقائيًا عبر خطاف (انظر deploy/cpanel/README.md).
#
# مهم: بدّل USERNAME باسم مستخدم حسابك في cPanel (المسار الظاهر أعلى File Manager: /home/USERNAME).
# جذر النشر هنا هو public_html مباشرةً (الموقع في نطاقك الرئيس). لنشره في مجلد فرعي
# (مثل مجال فرعي) غيّر DEPLOYPATH إلى ذلك المسار.
#
# لا يُنشر إلا ما تنشره Netlify: الصفحة وبيانات الإصدار. أما الوثائق البحثية (*.md)
# والنموذج الأولي graph.prototype.js فلا تُنسخ عمدًا (محتوى بحثي غير موثّق للنشر العام).
deployment:
  tasks:
    - export DEPLOYPATH=/home/USERNAME/public_html
    - /bin/mkdir -p "$DEPLOYPATH/data"
    - /bin/cp -f andalus/index.html "$DEPLOYPATH/index.html"
    - /bin/cp -f andalus/data/graph.js "$DEPLOYPATH/data/graph.js"
    - /bin/cp -f andalus/data/graph.evidence.js "$DEPLOYPATH/data/graph.evidence.js"
    - /bin/cp -f andalus/data/schema.json "$DEPLOYPATH/data/schema.json"
    - /bin/cp -f deploy/cpanel/.htaccess "$DEPLOYPATH/.htaccess"
